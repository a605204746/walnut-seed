[project]
name = "walnut-backend"
version = "1.0.0"
description = "WalnutSeed 后端：FastAPI + SQLAlchemy 异步后台管理脚手架"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",                         # 文件操作
    "alembic==1.18.4",                          # 数据库迁移
    "bleach==6.4.0",                            # 过滤 HTML 标签（XSS）
    "click==8.1.7",                             # 命令行参数解析
    "cryptography==44.0.0",                     # RSA / AES 接口加解密
    "fastapi==0.138.2",                         # fastapi 框架
    "greenlet==3.5.2",                          # 协程核心依赖（SQLAlchemy 异步）
    "httpx==0.28.1",                            # HTTP 客户端
    "jinja2==3.1.6",                            # 模板引擎（预留代码生成）
    "loguru==0.7.3",                            # 日志
    "openpyxl==3.1.5",                          # Excel 文件处理
    "psutil==7.2.2",                            # 系统信息
    "pydantic-settings>=2.6.1",                 # 配置设置
    "pyjwt==2.13.0",                            # JWT
    "python-multipart==0.0.32",                 # 表单/文件上传解析
    "redis==7.1.0",                             # redis 异步操作
    "rich==15.0.0",                             # 终端打印美化
    "sqlalchemy==2.0.51",                       # 数据库 ORM
    "tinycss2==1.5.1",                          # bleach CSS 清洗依赖
    "typer==0.26.7",                            # 命令行工具
    "ua-parser==1.0.2",                         # 解析 User-Agent 获取 OS/浏览器
    "uvicorn==0.49.0",                          # uvicorn web 框架
    "websockets>=16.0,<17.0",                   # websocket 通信
    "aiomysql>=0.2.0",                          # MySQL 异步驱动
    "pymysql==1.2.0",                           # MySQL 同步驱动（alembic）
    "pydantic[email]>=2.12.5",                  # 邮箱校验
    "bcrypt>=5.0.0",
    "pillow>=12.3.0",
    "minio>=7.2.20",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2.0", "pymysql==1.2.0"]
gm = ["gmssl==3.2.2"]                          # 国密 SM2/SM4（可选）

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.21.0,<3",   # 测试：内存 Redis
    "pytest==9.0.2",
    "pytest-asyncio>=0.24.0", # 异步测试支持
    "ruff==0.14.13",          # 代码检查/格式化
]

[tool.uv]
default-groups = ["dev"]     # 本地 uv sync 含 dev；生产 uv export 不含 dev

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.ruff]
line-length = 200
indent-width = 4
preview = false
fix = true
show-fixes = true
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants_d", ".pyenv",
    ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist",
    "node_modules", "site-packages", "venv",
]
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = ["FAST", "F", "E", "W", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "B904",  # Within an `except` clause
    "B010",  # Do not call with a constant attribute value
    "B009",  # Do not use getattr() with a constant attribute value
    "E712",  # Avoid equality comparisons to `False`
    "W293",  # blank line with whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
preview = false
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["app/alembic/versions/"]
