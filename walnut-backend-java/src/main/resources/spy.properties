# P6Spy 配置
modulelist=com.baomidou.mybatisplus.extension.p6spy.MybatisPlusLogFactory,com.p6spy.engine.outage.P6OutageFactory

# 日志格式：使用 MyBatis-Plus 内置格式（含执行耗时）
logMessageFormat=com.baomidou.mybatisplus.extension.p6spy.P6SpyLogger

# 通过 SLF4J/Logback 输出（统一日志体系，受级别/文件/异步控制）
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 取消 JDBC URL 前缀
useprefix=true

# 过滤类别：只保留 statement（实际 SQL）和 rollback
excludecategories=info,debug,result,commit,resultset,batch

# 日期格式
dateformat=yyyy-MM-dd HH:mm:ss
databaseDialectTimestampFormat=yyyy-MM-dd HH:mm:ss

# 慢 SQL 检测（超过 3 秒视为慢 SQL，打印警告）
outagedetection=true
outagedetectioninterval=3

# SQL 过滤
filter=true
exclude=
