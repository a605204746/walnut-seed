worker_processes auto;
# 停机时给在途请求（含 SSE 长连接，见 /prod-api/ 的 proxy_read_timeout）最多 10s 收尾，超时强断
worker_shutdown_timeout 10s;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # 可以根据业务并发量适当调高
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    # 高效传输文件
    sendfile        on;
    # 长连接超时时间
    keepalive_timeout  65;
    # 单连接最大请求数，提高长连接复用率
    keepalive_requests 100000;
    # 限制body大小
    client_max_body_size 100m;
    client_header_buffer_size 32k;
    client_body_buffer_size   512k;
    # 开启静态资源压缩
    gzip_static on;
    # 连接数限制 (防御类配置) 10m 一般够用了，能存储上万 IP 的计数
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;
    # 隐藏 nginx 版本号，防止暴露版本信息
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    upstream server {
        server ${BACKEND_HOST}:${BACKEND_PORT};
    }

    server {
        listen       80;
        server_name  localhost;

        # ===== 安全响应头（server 级默认下发）=====
        # 故意不加 CSP：vben 构建产物含内联脚本/内联样式，CSP 会直接打破页面加载；
        # 如需启用，请先改造构建配置去除内联资源再评估 script-src/style-src。
        # 注意 nginx add_header 继承规则：某层（location/if）一旦出现 add_header，
        # 就不再继承上层定义——因此下方 location / 的 if 块与 /assets/ 中需重复声明。
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # https配置参考 start（现代写法：ssl on; 已废弃，直接在 listen 声明 ssl）
        #listen       443 ssl;

        # 证书直接存放 /docker/nginx/cert/ 目录下即可 更改证书名称即可 无需更改证书路径
        #ssl_certificate      /etc/nginx/cert/xxx.local.crt; # /etc/nginx/cert/ 为docker映射路径 不允许更改
        #ssl_certificate_key  /etc/nginx/cert/xxx.local.key; # /etc/nginx/cert/ 为docker映射路径 不允许更改
        #ssl_session_timeout 5m;
        # 仅启用现代协议（TLSv1/1.1 已于 2021 年被 RFC 8996 正式废弃）
        #ssl_protocols TLSv1.2 TLSv1.3;
        #ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        #ssl_prefer_server_ciphers on;
        # https配置参考 end

        # 演示环境配置 拦截除 GET POST 之外的所有请求
        # if ($request_method !~* GET|POST) {
        #     rewrite  ^/(.*)$  /403;
        # }

        # location = /403 {
        #     default_type application/json;
        #     return 200 '{"msg":"演示模式，不允许操作","code":500}';
        # }

        location / {
            if ($request_filename ~* .*\.(?:htm|html)$) {
              # 入口 html 禁止缓存（发版后立即拿到新 hash 的资源引用）；
              # if 块内出现 add_header 后不再继承 server 级头，故安全头在此重复声明
              add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
              add_header X-Content-Type-Options nosniff;
              add_header X-Frame-Options SAMEORIGIN;
              add_header Referrer-Policy strict-origin-when-cross-origin;
              access_log on;
            }
            root   /usr/share/nginx/html; # docker映射路径 不允许更改
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        # vben/vite 构建产物（/assets/ 下 js/css/字体等）文件名含内容哈希，可安全长缓存；
        # 内容变更即文件名变更，immutable 让浏览器在有效期内连条件请求都省掉。
        # 同样因 add_header 继承规则，安全头需在此重复声明。
        location /assets/ {
            root   /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options SAMEORIGIN;
            add_header Referrer-Policy strict-origin-when-cross-origin;
            access_log off;
        }

        # 上传文件访问：后端返回中性路径 /upload/{key}，经后端从对象存储流式返回
        location /upload/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://server;
        }

        location /prod-api/ {
            # 并发连接限制（对接 http 块中已定义的 limit_conn_zone）：
            # 单 IP 最多 50 条并发连接、全站最多 500 条，超限直接 503，
            # 防单 IP 打满后端/长连接（本 location 有 SSE，连接数会偏多，阈值已留余量）
            limit_conn perip 50;
            limit_conn perserver 500;
            # 设置客户端请求头中的 Host 信息（保持原始 Host）
            proxy_set_header Host $http_host;
            # 获取客户端真实 IP
            proxy_set_header X-Real-IP $remote_addr;
            # 自定义头 REMOTE-HOST，记录客户端 IP
            proxy_set_header REMOTE-HOST $remote_addr;
            # 获取完整的客户端 IP 链（经过多级代理时）
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 设置后端响应超时时间（这里是 24 小时，适合长连接/SSE）
            proxy_read_timeout 86400s;
            # SSE (Server-Sent Events) 与 WebSocket 支持参数
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # 禁用代理缓冲，数据直接传给客户端
            proxy_buffering off;
            # 禁用代理缓存
            proxy_cache off;
            proxy_pass http://server/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
